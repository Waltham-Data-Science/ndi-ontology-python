# ndi_matlab_python_bridge.yaml — src/ndi_ontology/
# The Primary Contract for the ndi.ontology namespace.

project_metadata:
  bridge_version: "1.2"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"

  matlab_source_of_truth: "Waltham-Data-Science/ndi-ontology-matlab"
  matlab_source_note: >
    NDI-matlab no longer contains +ndi/ontology.m. The ontology code was
    extracted into ndi-ontology-matlab (commit d302b0d) and is pulled back
    into NDI-matlab through requirements.txt. All MATLAB paths in this file
    are relative to ndi-ontology-matlab unless the entry says otherwise.
    Examined against ndi-ontology-matlab at 984abef (2026-09-02); re-examined
    at 9d8fc03 (2026-10-14) for its PR #9 (WormBase, NCBITaxon synonyms,
    string input); re-examined at 1fbd38b (2026-10-20) for its PR #10 (OM
    units from OM's own file; MICRO, MCO, OBI, ZECO, WBls, OWLTime, CREDIT).

  matlab_examined_hash: "1fbd38b"
  matlab_examined_date: "2026-10-20"
  examination_note: >
    Per the porting guide's section 3, each entry records
    matlab_last_sync_hash: the short hash of the MATLAB file the Python side
    was actually written against. Obtain it with
    `git log -1 --format="%h" -- <path>` in ndi-ontology-matlab.
    Entries whose Python side predates the MATLAB extraction carry
    sync_status instead of a hash, and say so rather than claiming a sync
    that never happened. Do not fill a hash in without reading the .m file.

  package_name_divergence:
    matlab: "ndi.ontology"
    python_distribution: "ndi-ontology"
    python_import: "ndi_ontology"
    reexported_by_ndi_python_as: "ndi.ontology"
    decision_log: >
      The one standing violation of Strict MATLAB Mirror, and it is forced
      by the language rather than chosen. MATLAB merges the `ndi` namespace
      across every folder on the path, so ndi-ontology-matlab contributes
      +ndi/ontology.m to the same namespace as NDI-matlab at no cost.
      Python cannot: NDI-python's ndi/__init__.py carries the public API,
      which makes `ndi` a regular package, and a second distribution cannot
      install a subpackage into a regular package. Making `ndi` a PEP 420
      namespace package would restore the exact mirror, but it would move
      NDI-python's entire public API surface and rework its packaging and
      symmetry harness — disproportionate to this split.
      So the distribution is top-level `ndi_ontology`, and NDI-python
      re-exports it at ndi/ontology/__init__.py. Every caller inside
      NDI-python still writes `from ndi.ontology import lookup`, which is
      what keeps the call sites mirroring MATLAB. Standalone callers write
      `from ndi_ontology import lookup`.
      Recorded 2026-09-02.

# =========================================================================
# Classes
# =========================================================================
classes:

  # =========================================================================
  # ndi.ontology (MATLAB is a class with static methods; Python uses a module
  # with functions + a provider class hierarchy)
  # =========================================================================
  - name: ontology
    type: class
    matlab_path: "src/ndi/+ndi/ontology.m"
    python_path: "ndi_ontology/__init__.py"
    python_class: "module-level functions + OntologyResult"
    inherits: ""
    matlab_last_sync_hash: "44efcec"
    sync_status: >
      Re-examined at 44efcec (2026-10-20): the one change is clearCache, which
      now also forgets OM's file index (ndi.ontology.OM.fileIndex(true));
      Python's clearCache() calls OMProvider.fileIndex(True) to match.
      Interface examined against ontology.m at 9d9b4e1 (2026-09-02), and now
      behaviourally synced as well: all 26 ontology classes are ported, the
      prefix map is single-sourced from ontology_list.json, and lookup()
      raises NDIOntologyLookupError where MATLAB raises, rather than returning
      an empty OntologyResult. NDI-python#98 is closed.
      One deliberate difference in shape, not behaviour: MATLAB raises
      assorted identifiers (ndi:ontology:NDIC:IDNotFound,
      ndi:ontology:EDAM:LookupFailed, ...) that callers catch as one
      MException; Python raises one type for all of them, with the originating
      error chained so a transport failure stays diagnosable. Providers keep
      returning an empty result internally for "not found"; lookup() is where
      that becomes the raise, so the public contract matches MATLAB while the
      provider protocol stays simple to test.

    properties:
      # MATLAB has hidden Constant properties for file paths
      - name: ONTOLOGY_FILENAME
        type_matlab: "Constant Hidden char"
        type_python: "N/A (handled by ndi_common_PathConstants)"
        decision_log: >
          MATLAB stores ontology file path as class constant.
          Python resolves paths via ndi.common.ndi_common_PathConstants.

      - name: ONTOLOGY_SUBFOLDER_JSON
        type_matlab: "Constant Hidden char"
        type_python: "N/A (handled by ndi_common_PathConstants)"
        decision_log: "Same as ONTOLOGY_FILENAME."

      - name: ONTOLOGY_SUBFOLDER_NDIC
        type_matlab: "Constant Hidden char"
        type_python: "N/A (handled by ndi_common_PathConstants)"
        decision_log: "Same as ONTOLOGY_FILENAME."

      - name: NDIC_FILENAME
        type_matlab: "Constant Hidden char"
        type_python: "N/A (handled by ndi_common_PathConstants)"
        decision_log: "Same as ONTOLOGY_FILENAME."

    methods:
      # --- Static: Main lookup entry point ---
      - name: lookup
        kind: static
        input_arguments:
          - name: lookup_string
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: "[id, name, prefix, definition, synonyms, shortName]"
            type_matlab: "6 separate output arguments (char, char, char, char, cell, char)"
            type_python: "OntologyResult (one object, six attributes)"
        return_shape_divergence: resolved
        decision_log: >
          CORRECTED 2026-09-02. The previous entry read "MATLAB returns a
          struct with id, name, definition, synonyms, shortName". That is
          wrong twice over: ontology.m:125 declares
          `[id, name, prefix, definition, synonyms, shortName] = lookup(...)`,
          so MATLAB returns SIX separate output arguments, not a struct, and
          the old list omitted `prefix`. The struct exists only as the
          internal cache entry (ontology.m:330-336), never as a return value.
          MATLAB's own TestOntologyLookup.m consumes it positionally:
          `[id, name, ~, ~, ~] = funcToTest()`.
          The divergence this was hiding is real and remains: the porting
          guide's section 5 and ndi_xlang_principles section 3 both require
          multiple MATLAB outputs to be returned as a Python TUPLE in
          declaration order. Python returns a single OntologyResult instead.
          It carries all six fields, so no information is lost, and an object
          is arguably the better Python API -- but it is a divergence from the
          stated contract, and it must be recorded as one rather than
          described as a "functional match".
          It had already cost something. NDI-python's ndi/fun/doc.py:135, 169
          and 198 each wrote `ont_id, name = lookup(...)`, the MATLAB-shaped
          positional unpack. OntologyResult defined __slots__ and no
          __iter__, so every one of those raised TypeError into an
          `except Exception` that fell back to using the input string as both
          id and name: Species, Strain and biological-sex lookups in
          ndi.fun.doc had never resolved, and never reported that they did
          not.
          RESOLVED 2026-09-02. OntologyResult now defines __iter__ and
          __len__, yielding the six fields in MATLAB's declared order, so a
          caller may read the result either way:
            id, name, prefix, definition, synonyms, shortName = lookup(...)
            id, name, *_ = lookup(...)
            result.id
          __iter__ reads __slots__ rather than a second hand-written list, so
          the tuple order cannot drift from the field list, and
          test_iteration_order_matches_matlab pins __slots__ to the order
          transcribed from ontology.m:125 -- the test compares against MATLAB,
          not against the class, so reordering the fields fails it.
          One asymmetry remains and cannot be removed: MATLAB lets a caller
          request FEWER outputs than are declared, while Python unpacking
          demands an exact count. `id, name = lookup(...)` still raises, now
          ValueError rather than TypeError. The MATLAB-shaped read of the
          first N outputs is therefore spelled `id, name, *_`, which is what
          NDI-python's three call sites now use.
          Python uses a prefix-based dispatcher routing to provider classes;
          MATLAB uses static methods on the ontology class. Both accept the
          same 'prefix:id' input format. Uses @pydantic.validate_call.
          FIXED 2026-10-21 (#11): lookup() now sets prefix, synonyms and
          shortName itself after the provider returns, as MATLAB's does --
          prefix as typed and trimmed (ontology.m:295), synonyms flattened
          with empties dropped (:316-327), shortName = name2variableName(name)
          (:332). They were left to each provider, and the providers
          disagreed: the OLS-backed ones returned OLS's short_form
          ('CL_0000540') as shortName, nine others returned '', and several
          returned a canonical prefix ('NDIC' for 'ndic:8', 'NCBITaxon' for
          'taxonomy:9606'). NDI-python names treatment columns in its subject
          tables from shortName, so the same dataset got different columns
          in each language. The shared-case runner now asserts both fields.
          FIXED 2026-10-21: lookup() now trims the prefix and the remainder
          before mapping the prefix and calling the provider, as
          getOntologyNameFromPrefix does (ontology.m:493, read at 44efcec).
          Python used to match the untrimmed prefix and pass the untrimmed
          remainder, so 'CL: 0000540' and ' CL:0000540' failed in Python and
          resolved in MATLAB. The cache is still keyed on the string as typed,
          as MATLAB's is. Python's str.strip() stands in for strtrim; the two
          differ only on NUL characters, which strtrim also removes.

      # --- Instance: lookupTermOrID ---
      - name: lookupTermOrID
        input_arguments:
          - name: lookup_string
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: id
            type_python: "str"
          - name: name
            type_python: "str"
          - name: definition
            type_python: "str"
          - name: synonyms
            type_python: "list[str]"
          - name: shortName
            type_python: "str"
        decision_log: >
          MATLAB returns 5 separate outputs. Python wraps these in an
          OntologyResult object. The instance method is not directly
          exposed in Python; the static lookup() function serves the
          same role. Documented here for completeness.

      # --- Static: clearCache ---
      - name: clearCache
        kind: static
        input_arguments: []
        output_arguments: []
        decision_log: >
          DISCREPANCY FIXED: Python ad-hoc port used 'clear_cache'
          (snake_case). Renamed to 'clearCache' to match MATLAB.
          Synchronized 2026-03-13. Since 44efcec it also clears OM's file
          index, as MATLAB's does.
          It also resets EMPTYProvider._cache, which has no MATLAB
          counterpart: EMPTY.m downloads its OWL file on every lookup and
          caches nothing. MATLAB's clearCache does clear lookupOBOFile's
          cache, but nothing in ndi-ontology-matlab calls lookupOBOFile, so
          that cache is always empty and there is nothing to mirror. An
          earlier note here (2026-10-20) wrongly paired the two. Corrected
          2026-10-21.

      # --- Static: getOntologyNameFromPrefix ---
      - name: getOntologyNameFromPrefix
        kind: static
        input_arguments:
          - name: prefix
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: ontology_name
            type_python: "str"
        decision_log: >
          Python implements this as _load_prefix_map() + dict lookup.
          Not exposed as a public API since the dispatch is internal.
          Documented for completeness.

      # --- Static: getPrefixOntologyMappings ---
      - name: getPrefixOntologyMappings
        kind: static
        input_arguments: []
        output_arguments:
          - name: mappings
            type_python: "dict[str, str]"
        decision_log: >
          Python implements this by reading ontology_list.json (see
          _load_prefix_map; the _PREFIX_MAP literal was removed for
          NDI-python#98) and
          _load_prefix_map(). Not exposed as separate public function.
          Documented for completeness.

      # --- Static: getOntologies ---
      - name: getOntologies
        kind: static
        input_arguments: []
        output_arguments:
          - name: ontologies
            type_python: "list[str]"
        decision_log: >
          Not directly ported. Available via PROVIDER_REGISTRY.keys().
          Documented for completeness.

      # --- Static: performIriLookup ---
      - name: performIriLookup
        kind: static
        input_arguments:
          - name: iri
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: result
            type_python: "OntologyResult"
        decision_log: >
          Python implements IRI-based lookup inside OLSProvider subclasses.
          Not exposed as a separate public function.
          Documented for completeness.

      # --- Static: searchOLSAndPerformIRILookup ---
      - name: searchOLSAndPerformIRILookup
        kind: static
        input_arguments:
          - name: term
            type_matlab: "char"
            type_python: "str"
          - name: ontology
            type_matlab: "char"
            type_python: "str"
          - name: queryFields
            type_matlab: "char"
            type_python: "str"
            default: "'label'"
        output_arguments:
          - name: result
            type_python: "OntologyResult"
        decision_log: >
          Python implements this inside OLSProvider._search_ols().
          Not exposed as a separate public function.
          Documented for completeness.

      # --- Static: lookupOBOFile ---
      - name: lookupOBOFile
        kind: static
        input_arguments:
          - name: filename
            type_matlab: "char"
            type_python: "str"
          - name: term
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: result
            type_python: "OntologyResult"
        decision_log: >
          NOT PORTED, and nothing needs it. MATLAB's lookupOBOFile parses a
          local .obo file, but nothing in ndi-ontology-matlab calls it --
          EMPTY.m in particular reads OWL files from GitHub, not .obo -- so
          it has no behaviour to mirror. An earlier note here called
          EMPTYProvider its Python counterpart; that was wrong (corrected
          2026-10-21). Documented for completeness.

# =========================================================================
# Provider classes
# =========================================================================
# MATLAB implements each ontology as a class in +ndi/+ontology/<Name>.m.
# Python implements each as a <Name>Provider in providers.py, registered in
# PROVIDER_REGISTRY and dispatched by prefix.
#
# CORRECTION (2026-09-02): earlier revisions of this file claimed MATLAB
# covered only 3 ontologies (NDIC, UBERON, NCIm) through scattered
# +ndi/+database/+fun functions, and that ndi.ontology.lookup() was "planned
# but does not yet exist". Both statements described NDI-matlab before the
# extraction. ndi-ontology-matlab implements ndi.ontology.lookup and 19
# ontology classes today, so the Python port is behind MATLAB here, not
# ahead of it.
#
# Every Python provider below was written before the MATLAB extraction, as
# part of NDI-python's ad-hoc ontology port. None has been read against the
# .m file it claims to mirror. Following NDI-python#90's convention, they are
# marked not-examined rather than given a sync hash they have not earned:
# matlab_last_sync_hash names the MATLAB revision to examine, and sync_status
# says plainly that the examination has not happened. The first agent to
# touch a provider should read its .m file and correct its entry.
providers:

  - name: CL
    matlab_path: "src/ndi/+ndi/+ontology/CL.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "CLProvider"
    inherits: "OLSProvider"
    status: ported
    matlab_last_sync_hash: "8e109b0"
    sync_status: >
      NOT EXAMINED against CL.m at 8e109b0. Python implementation predates
      the extraction and mirrors NDI-python's pre-split behaviour, which was
      never checked against this MATLAB class.

  - name: CHEBI
    matlab_path: "src/ndi/+ndi/+ontology/CHEBI.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "CHEBIProvider"
    inherits: "OLSProvider"
    status: ported
    matlab_last_sync_hash: "8e109b0"
    matlab_examined: partial
    sync_status: >
      ID-HANDLING PATH EXAMINED against ontology.m at 9d9b4e1 (2026-09-02);
      the rest of CHEBI.m at 8e109b0 is still unexamined.
      MATLAB's preprocessLookupInput (ontology.m:395) builds the OLS query
      as `[ontology_prefix ':' numeric_id]` -- the numeric id verbatim,
      with no padding. Python padded it with term.zfill(7); FIXED
      2026-09-02 to pass through. The padding was a no-op for every
      ontology whose ids are 7 digits (CL, PATO, Uberon, EMPTY), which is
      why it went unnoticed, and wrong for CHEBI, whose are not: every
      lookup by id sent CHEBI:0015377 for CHEBI:15377 and matched nothing,
      while lookup by name kept working. Found by the shared case table's
      first live run in CI. The fix is in OLSProvider, so it applies to
      CL, PATO, EFO, SNOMED and OM as well; only CHEBI was affected.
      never checked against this MATLAB class.

  - name: PATO
    matlab_path: "src/ndi/+ndi/+ontology/PATO.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "PATOProvider"
    inherits: "OLSProvider"
    status: ported
    matlab_last_sync_hash: "8e109b0"
    sync_status: >
      NOT EXAMINED against PATO.m at 8e109b0. Python implementation predates
      the extraction and mirrors NDI-python's pre-split behaviour, which was
      never checked against this MATLAB class.

  - name: EFO
    matlab_path: "src/ndi/+ndi/+ontology/EFO.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "EFOProvider"
    inherits: "OLSProvider"
    status: ported
    matlab_last_sync_hash: "8e109b0"
    sync_status: >
      NOT EXAMINED against EFO.m at 8e109b0. Python implementation predates
      the extraction and mirrors NDI-python's pre-split behaviour, which was
      never checked against this MATLAB class.

  - name: SNOMED
    matlab_path: "src/ndi/+ndi/+ontology/SNOMED.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "SNOMEDProvider"
    inherits: "OLSProvider"
    status: ported
    matlab_last_sync_hash: "8e109b0"
    sync_status: >
      NOT EXAMINED against SNOMED.m at 8e109b0. Python implementation predates
      the extraction and mirrors NDI-python's pre-split behaviour, which was
      never checked against this MATLAB class.

  - name: OM
    matlab_path: "src/ndi/+ndi/+ontology/OM.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "OMProvider"
    inherits: "OLSProvider"
    status: ported
    matlab_examined: partial
    matlab_last_sync_hash: "ddbd1d0"
    sync_status: >
      STEP 0 EXAMINED and PORTED against OM.m at ddbd1d0 (2026-10-20); the OLS
      fallback (OM's branch of preprocessLookupInput) is still the pre-split
      Python and not re-examined.
      OM's units are individuals (om:metre is an om:Unit), which OLS does not
      index, so OM.m (since 44efcec) reads OM's own RDF file first:
      fileIndex downloads RDF_URL once per session, parseRDF indexes every
      top-level `  <tag rdf:about="&om;local">` block (merging blocks that
      share an identifier; English label, comment, alternative labels), and
      findInIndex tries five rules in order -- identifier exact, identifier
      ignoring case, label, alternative label, camel-case heuristic against
      labels -- taking the first that names exactly one entry. Numeric terms
      skip the file. An unreadable file warns
      (ndi:ontology:OM:FileUnavailable; Python warnings.warn) and falls back
      to OLS. All three static methods are ported under MATLAB's names on
      OMProvider; findInIndex returns a 0-based index or None where MATLAB
      returns a 1-based index or []. The regex is MATLAB's, with re.M|re.S
      for MATLAB's lineanchors and its newline-matching '.'.
      Verified 2026-10-20 against the live om-2.0.rdf: all 18 of the table's
      OM cases match, including the 10 that 44efcec added.
    methods:
      - name: fileIndex
        kind: static
        python_name: "OMProvider.fileIndex"
        input_arguments:
          - name: reset
            type_python: "bool = False"
        output_arguments:
          - name: idx
            type_python: "dict[str, list] | None"
      - name: parseRDF
        kind: static
        python_name: "OMProvider.parseRDF"
        input_arguments:
          - name: txt
            type_python: "str"
        output_arguments:
          - name: idx
            type_python: "dict[str, list] (local, label, definition, alternative, kind)"
      - name: findInIndex
        kind: static
        python_name: "OMProvider.findInIndex"
        input_arguments:
          - name: idx
            type_python: "dict[str, list]"
          - name: term
            type_python: "str"
        output_arguments:
          - name: k
            type_python: "int | None (0-based; MATLAB 1-based or [])"

  - name: NDIC
    matlab_path: "src/ndi/+ndi/+ontology/NDIC.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "NDICProvider"
    inherits: "OntologyProvider"
    status: ported
    matlab_last_sync_hash: "73e71fc"
    matlab_examined: true
    sync_status: >
      EXAMINED against NDIC.m at 73e71fc (2026-09-02).
      MATLAB returns the BARE identifier: NDIC.m:67 is `id = num2str(ndicData.Identifier(rowIndex))`, the prefix having been stripped before dispatch (NDIC.m:21). Python returned 'NDIC:8'; FIXED 2026-09-02 to return '8'. Found by the shared case table on its first run, offline.
      never checked against this MATLAB class.

  - name: NCIm
    matlab_path: "src/ndi/+ndi/+ontology/NCIm.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "NCImProvider"
    inherits: "OntologyProvider"
    status: ported
    matlab_last_sync_hash: "8e109b0"
    matlab_examined: true
    sync_status: >
      EXAMINED against NCIm.m at 8e109b0 (2026-09-02).
      MATLAB returns the BARE concept code: NCIm.m:138 is `id = char(data.code)`. Python returned 'NCIm:C0018787'; FIXED 2026-09-02 to return 'C0018787'. Same defect as NDIC, found by reading the case table's expected_id column after the NDIC failure.
      never checked against this MATLAB class.

  - name: NCBITaxon
    matlab_path: "src/ndi/+ndi/+ontology/NCBITaxon.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "NCBITaxonProvider"
    inherits: "OntologyProvider"
    status: ported
    matlab_last_sync_hash: "0c18bf8"
    sync_status: >
      SYNONYMS EXAMINED against NCBITaxon.m at 0c18bf8 (2026-10-14); the id
      and name-search paths are still NOT EXAMINED.
      MATLAB's synonyms now come from the static parseOtherNames, ported as
      NCBITaxonProvider.parseOtherNames under its MATLAB name, with the same
      regular expressions, kept kinds and order (tagged elements first, then
      <Name> entries of a kept <ClassCDE>, unescaped, trimmed, de-duplicated).
      Python previously returned every <DispName> -- authority citations and
      misspellings included -- plus <CommonName>, and missed <Synonym> and
      <GenbankCommonName>. Tests: tests/matlab_tests/test_ontology_parsing.py.
    methods:
      - name: parseOtherNames
        kind: static
        python_name: "NCBITaxonProvider.parseOtherNames"
        input_arguments:
          - name: xml_response
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: names
            type_matlab: "cell column of char"
            type_python: "list[str]"

  - name: WormBase
    matlab_path: "src/ndi/+ndi/+ontology/WormBase.m"
    python_path: "ndi_ontology/providers.py"
    python_class: "WormBaseProvider"
    inherits: "OntologyProvider"
    status: ported
    matlab_examined: true
    matlab_last_sync_hash: "ff3c3fd"
    sync_status: >
      EXAMINED and PORTED against WormBase.m at ff3c3fd (2026-10-14).
      Renamed from WBStrain / WBStrainProvider, as MATLAB renamed the class
      (ff3c3fd); the WBStrain prefix is unchanged and a new `wormbase` prefix
      (the Bioregistry CURIE, wormbase:WBStrain00000001) routes here too, its
      id returned in that form. Strains are read from WormMine's InterMine
      query service (jsonobjects), as MATLAB does since 0c18bf8: wormbase.org
      and rest.wormbase.org answer scripts with a Cloudflare 403. The old
      Python provider read rest.wormbase.org for ids and the Alliance search
      API for names, and swallowed every error into an empty result.
      Definition is "Genotype: ... Mutagen: ... Outcrossed: ...", synonyms the
      otherName. Not found is an empty result (lookup() raises); a non-strain
      WormBase id, a "*", an ambiguous or mismatched name, and a WormMine
      error raise ValueError, where MATLAB raises ndi:ontology:WormBase:*.
    methods:
      - name: parseStrain
        kind: static
        python_name: "WormBaseProvider.parseStrain"
        input_arguments:
          - name: strain
            type_matlab: "struct (one webread-decoded WormMine record)"
            type_python: "dict (one JSON-decoded WormMine record)"
        output_arguments:
          - name: "[id, name, definition, synonyms]"
            type_python: "tuple[str, str, str, list[str]]"
      - name: queryWormMine
