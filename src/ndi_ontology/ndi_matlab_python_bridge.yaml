      development/src/ontology/empty-edit.owl; a 404 there re-raises main's
      error; any other failure there raises LookupFailed carrying both
      (EMPTY.m:46-51). TermNotFound from the provider becomes an empty
      result, which lookup() turns into NDIOntologyLookupError; every other
      error propagates and is chained by lookup().
      The six EMPTY cases in the shared table pass live against GitHub raw.
      The development branch currently 404s, so live lookups exercise only
      the main path; the fallback is covered by the mocked tests alone.
      DIFFERENCES, deliberate: (a) EMPTY.m:39 detects the missing branch by
      sniffing the error message for '404' or 'Not Found'; Python checks the
      HTTP status code, so a term containing '404' is not mistaken for a
      missing branch. Only which error is raised can differ; both raise.
      (b) CACHING: EMPTY.m caches nothing and downloads on every lookup.
      Python caches each file's body by URL for the life of the process.
      Kept because a failure can no longer be what it holds: a failed
      download raises and caches nothing (the old empty-index cache once
      hid a 404'ing URL behind three vacuously passing not-found cases),
      and clearCache() resets EMPTYProvider._cache. A development-branch
      404 is a failure too, so it is not cached and is re-requested by each
      lookup that misses on main, as in MATLAB.
