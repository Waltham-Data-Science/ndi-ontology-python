    python_class: "SchemaOrgProvider"
    inherits: "OntologyProvider"
    status: ported
    matlab_examined: true
    matlab_last_sync_hash: "9ec3f2b"
    sync_status: >
      EXAMINED and PORTED against SchemaOrg.m at 9ec3f2b (2026-09-02), for
      NDI-python#98.
      Neither OLS nor an OWL file: fetches https://schema.org/<Term> as JSON-LD and
      locates the @graph entry whose @id is the term, in either the compact
      form (schema:Person) or the full IRI -- MATLAB checks both because the
      response uses them interchangeably (see 9ec3f2b, which fixed exactly
      this). The id is the term as given, not canonicalised, and name falls
      back to the term when the document carries no rdfs:label.


