      OWLTime and CREDIT, all with providers here. CREDIT and OWLTime join
      NDIC as offline cases, run without the network gate.

# =========================================================================
# Caching
# =========================================================================
caching:
  matlab: "lookupCache containers.Map, size-limited, keyed by lookup string"
  python: "_lookup_cache dict, size-limited (_CACHE_MAX), keyed by lookup string"
  decision_log: >
    Same shape, but MATLAB cannot cache a failure and Python could. MATLAB's
    lookup raises on a failed lookup, so control never reaches the cache write
    at ontology.m:330-336 -- only successes are ever stored. Python returned an
    empty OntologyResult instead of raising and cached it unconditionally, so
    one timeout or one 429 from a throttling API became a permanent wrong
    answer for that term for the life of the process, unreachable by anything
    short of clearCache().
    That is worse than it sounds because the providers cannot distinguish
    transport failure from "not found": OLSProvider._search_ols ends
    `except Exception: return OntologyResult()`, so a throttled request and a
    genuinely absent term produce the same value, and the cache then makes the
    wrong one permanent.
    FIXED 2026-09-02: only truthy results are cached. This does not close the
    underlying gap -- Python still returns empty where MATLAB raises, which is
    NDI-python#98's first item -- but it stops a transient failure from
    outliving the request that caused it.
    Found while diagnosing two shared-table cases (CL:cell, OM:Acidity) that
    failed one CI run after passing the two before it, in a run that took
    twice as long: OLS was throttling a 46-case burst.

# =========================================================================
# Symmetry
# =========================================================================
symmetry:
  mechanism: shared_fixture
  artifact_exchange_required: false
  decision_log: >
    NDI-python's symmetry suite has MATLAB produce artifacts that Python reads
    back (tests/symmetry/make_artifacts, read_artifacts). That machinery exists
    because those outputs -- sessions, documents, binary files -- cannot be
    written down as literals, so the only way to compare is to have one side
    generate and the other consume.
    ndi.ontology needs none of it. A lookup takes a string and returns a
    string pair, and ndi-ontology-matlab's ontology_lookup_tests.json already
    states the expected pair for each input. When the expected output can be
    written into the fixture, both implementations can be checked against the
    fixture directly -- which is a stronger check than artifact exchange, not
    a weaker substitute for it: it pins the values MATLAB must produce rather
    than only agreeing with whatever MATLAB last produced, and it cannot go
    stale between runs.
    One thing is outside what the shared fixture pins, and it does not want
    artifact plumbing: `definition` and `synonyms`, which the table does not
    carry (MATLAB's own test ignores them too -- it captures only id and name).
    If the table grows definition or synonym columns, this runner should assert
    them too.
    The error path is no longer outside it. The table's should_succeed=false
    cases once meant "MATLAB raises, Python returns an empty result", so the
    runner accepted either; since lookup() raises, both sides are checked the
    same way MATLAB checks itself, verifyError(funcToTest, ?MException).
    Recorded 2026-09-02.

  # --- Supporting modules with MATLAB equivalents ---
supporting_modules:

  - name: name2variableName
    matlab_path: "src/ndi/+ndi/+ontology/name2variableName.m"
    python_path: "ndi_ontology/name_utils.py"
    matlab_last_sync_hash: "73e71fc"
    python_name: "name2variableName (alias: name_to_variable_name)"
    decision_log: >
      ndi-ontology-matlab carries its own copy of name2variableName, whose
      body is byte-identical to NDI-matlab's +ndi/+fun/name2variableName.m,
      so that the ontology toolbox stands alone. Python mirrors that
      duplication for the same reason: NDI-python depends on this package,
      so importing ndi.fun.name_utils from here would be a dependency cycle.
      NDI-python keeps ndi/fun/name_utils.py for +ndi/+fun; this package
      keeps its own for +ndi/+ontology. If one changes, change both.
      Recorded 2026-09-02.

  - name: ontologyToolboxDir
    matlab_path: "src/ndi/+ndi/ontologyToolboxDir.m"
    python_path: "ndi_ontology/paths.py"
    matlab_last_sync_hash: "73e71fc"
    python_name: "ontologyToolboxDir (plus module constants)"
    decision_log: >
      MATLAB resolves data files relative to the folder holding the +ndi
      package, so ontology_list.json and NDIC.txt travel with the ontology
      code. Python mirrors this: the data files ship inside the package at
      src/ndi_ontology/ndi_common/ and every path derives from
      Path(__file__). Before the split these two files were read through
      ndi.common.ndi_common_PathConstants.COMMON_FOLDER, which pointed into
      NDI-python's tree; that is the dependency the split inverts, and the
      copies had already drifted (17 registered prefixes in NDI-python
      against 22 in ndi-ontology-matlab). Recorded 2026-09-02.

# =========================================================================
# Standalone functions (module-level)
# =========================================================================
functions:

  - name: lookup
    type: function
    matlab_path: "src/ndi/+ndi/ontology.m (static method)"
    python_path: "ndi_ontology/__init__.py"
    matlab_last_sync_hash: "0c18bf8"
    input_arguments:
      - name: lookup_string
        type_matlab: "char or string scalar"
        type_python: "str"
    output_arguments:
      - name: result
        type_python: "OntologyResult"
    decision_log: >
      Module-level convenience function. Delegates to provider registry.
      Uses @pydantic.validate_call. Synchronized 2026-03-13.
      0c18bf8 made MATLAB's lookup accept a string scalar
      (convertStringsToChars); Python has one string type, so nothing to
      port. Examined 2026-10-14.

  - name: clearCache
    type: function
    matlab_path: "src/ndi/+ndi/ontology.m (static method)"
    python_path: "ndi_ontology/__init__.py"
    matlab_last_sync_hash: "9d9b4e1"
    input_arguments: []
    output_arguments: []
    decision_log: >
      DISCREPANCY FIXED: Python ad-hoc port used 'clear_cache'
      (snake_case). Renamed to 'clearCache' to match MATLAB.
      Synchronized 2026-03-13.

