      no assumeTrue, no assumeFail and no skip of any kind -- only the class
      comment "Requires an active internet connection to query external APIs."
      Run it without one and it fails.
      Python skips instead, which is a real convenience for a developer behind
      a proxy that blocks ebi.ac.uk, and a lie in CI: four tests that quietly
      did not run look exactly like four that passed. That is how a stale
      assertion in test_lookup_invalid_term -- asserting lookup() "should not
      raise", the opposite of the verifyError this file's MATLAB source has
      always asserted -- survived a full local suite and first failed on CI.
      NDI_ONTOLOGY_REQUIRE_LIVE restores MATLAB's guarantee where it counts:
      set it, and unreachable APIs fail the run instead of skipping it. The
