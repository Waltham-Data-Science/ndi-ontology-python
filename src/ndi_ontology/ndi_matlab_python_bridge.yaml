# =========================================================================
# Tests
# =========================================================================
tests:

  - matlab_path: "tests/+ndi/+unittest/+ontology/TestOntologyLookup.m"
    python_path: "tests/matlab_tests/test_ontology.py"
    matlab_last_sync_hash: "8e109b0"
    sync_status: >
      Ported before the extraction; not re-read against TestOntologyLookup.m
      at 8e109b0.
    decision_log: >
      Skipping live tests has no MATLAB counterpart. TestOntologyLookup.m has
      no assumeTrue, no assumeFail and no skip of any kind -- only the class
      comment "Requires an active internet connection to query external APIs."
      Run it without one and it fails.
      Python skips instead, which is a real convenience for a developer behind
      a proxy that blocks ebi.ac.uk, and a lie in CI: four tests that quietly
      did not run look exactly like four that passed. That is how a stale
      assertion in test_lookup_invalid_term -- asserting lookup() "should not
      raise", the opposite of the verifyError this file's MATLAB source has
      always asserted -- survived a full local suite and first failed on CI.
      NDI_ONTOLOGY_REQUIRE_LIVE restores MATLAB's guarantee where it counts:
      set it, and unreachable APIs fail the run instead of skipping it. The
      shared-cases job sets it for both live modules. Unset, the skip stands,
      so a local run without network is still usable.
      Recorded 2026-09-02.

  - matlab_path: "tests/+ndi/+unittest/+ontology/TestNCBITaxonOtherNames.m"
    python_path: "tests/matlab_tests/test_ontology_parsing.py"
    matlab_last_sync_hash: "0c18bf8"
    sync_status: "PORTED 1:1 at 0c18bf8 (2026-10-14), as TestNCBITaxonOtherNames. Offline."

  - matlab_path: "tests/+ndi/+unittest/+ontology/TestWormBaseParsing.m"
    python_path: "tests/matlab_tests/test_ontology_parsing.py"
    matlab_last_sync_hash: "ff3c3fd"
    sync_status: >
      PORTED 1:1 at ff3c3fd (2026-10-14), as TestWormBaseParsing. Offline.
      The records are dicts with None where webread gives [].

