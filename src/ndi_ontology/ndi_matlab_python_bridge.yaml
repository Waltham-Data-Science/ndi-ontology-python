      with no artifact to build, exchange or version. CI checks out
      ndi-ontology-matlab and points NDI_ONTOLOGY_MATLAB_DIR at it; a copy
      here would drift as ontology_list.json did, and a stale test fixture
      reports parity that is not there.
      Of the 66: 47 run against ported providers, 19 skip themselves naming
      NDI-python#98, so the run doubles as a progress meter for the port.
      ff3c3fd (2026-10-14) added seven WormBase cases (by id, by name, the
